[package]
name = "katotonic"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "catotonic"
path = "src/bin/sync-server.rs"
bench = false
test = false
required-features = ["blocking"]

[[bin]]
name = "katotonic"
path = "src/bin/async-server.rs"
bench = false
test = false

[[bin]]
name = "kittytonic"
path = "src/bin/smol-server.rs"
bench = false
test = false
required-features = ["smol"]

[features]
default = []
smol = [
    "dep:smol",
    "dep:async-executor",
    "dep:num_cpus",
    "dep:futures-lite",
    "dep:smolscale",
    "dep:async-compat",
    "dep:async-notify",
]
blocking = ["dep:threadpool"]

[dependencies]
anyhow = "1.0.100"
async-compat = { version = "0.2.5", optional = true }
async-executor = { version = "1.13.3", optional = true }
async-notify = { version = "0.3.0", optional = true }
async-stream = { version = "0.3.6" }
async-trait = { version = "0.1.89" }

chitchat = "0.9.0"
clap = { version = "4.5.53", features = ["derive", "env"] }
config = "0.15.19"
console-subscriber = { version = "0.5.0" }
crossbeam = { version = "0.8.4" }

bytes = "1.10.1"
ciborium = "0.2.2"
dashmap = "6.1.0"

futures = "0.3.31"
futures-lite = { version = "2.6.1", optional = true }
futures-rustls = { version = "*" }
futures-util = "0.3.31"
# futures-rustls = { git = "https://github.com/rustls/futures-rustls", branch = "master" }

humantime = "2.3.0"

kanal = { version = "0.1.1" }

mry = "0.14.0"

num_cpus = { version = "1.17.0", optional = true }

parking_lot = { version = "0.12.5" }
portable-atomic = { version = "1.11.1" }

rand = "0.9.2"
rustls = "0.23.35"
rustls-pki-types = { version = "1.13", features = ["std"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smol = { version = "2.0.2", optional = true }
smolscale = { version = "0.4.16", optional = true }

mimalloc = "0.1"
thiserror = "2.0.17"
threadpool = { version = "1.8.1", optional = true }
tokio = { version = "1.48.0", features = ["net", "rt", "rt-multi-thread", "sync"] }
tokio-rustls = "0.26.4"
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.17", features = ["full"] }
tracing = "0.1.43"
tracing-log = { version = "0.2.0" }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "valuable"] }
trust-dns-resolver = "0.23.2"

uuid = { version = "1", features = ["serde", "v8"] }

webpki = "0.22.4"
webpki-roots = "1.0.4"

[dev-dependencies]
color-backtrace = "0.7.2"
ctor = "0.6.3"
proptest = "1.5.0"

[[example]]
name = "client"
path = "examples/client.rs"
bench = false
test = false

[[example]]
name = "sync-client"
path = "examples/sync-client.rs"
bench = false
test = false
required-features = ["blocking"]

[[example]]
name = "async-client"
path = "examples/async-client.rs"
bench = false
test = false

[[example]]
name = "smol-client"
path = "examples/smol-client.rs"
bench = false
test = false
required-features = ["smol"]
